[platformio]
default_envs = c3

[env]
# Pinned: an unpinned `platform = espressif32` silently jumps to a new Arduino
# core major (2.x -> 3.x / IDF 4.4 -> 5.5) on any `pio run`, which re-downloads
# the toolchain, changes esp_task_wdt_init()'s signature and grows the image by
# ~250 KB — enough to overflow this single-app 1.31 MB partition. Bump
# deliberately, re-test the board and re-check the partition table.
platform = espressif32@7.1.3
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    # 12 KB instead of the default 8 KB for the loop task: the WebServer handlers
    # run there, and /diag reported only ~2 KB of headroom left (top-list sort,
    # JSON building, HTTP parsing). A stack overflow here looks like a random
    # reboot, not a clean panic.
    -DARDUINO_LOOP_STACK_SIZE=12288
