name: blocklist

# Rebuilds the default blocklist daily and publishes it at a stable URL:
#   https://github.com/<owner>/esp32-c3-adblock/releases/download/blocklist/blocklist.bin
# The job runs on GitHub's cloud: it re-downloads the upstream source lists
# (Hagezi Pro + StevenBlack + Schakal RU AdList + AdGuard Russian) fresh each run,
# so the published file is always current. Point a device's "Remote auto-update"
# at the URL above and it stays current on its own.
on:
  schedule:
    - cron: "17 4 * * *"   # daily 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build default blocklist (fails if any source is unreachable)
        run: python3 tools/build_blocklist.py blocklist.bin 2>&1 | tee build.log
      - name: Sanity checks
        run: |
          size=$(stat -c%s blocklist.bin)
          echo "size=$size bytes"
          test $((size % 5)) -eq 0                  # whole 40-bit entries
          test "$size" -gt 150000                   # >30k entries, catches a silently shrunk list
          test "$size" -lt 1450000                  # fits the single-app filesystem partition
      - name: Publish to the 'blocklist' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          entries=$(( $(stat -c%s blocklist.bin) / 5 ))
          notes="Auto-built $(date -u +%F) — ${entries} entries (Hagezi Pro + StevenBlack + Schakal RU AdList + AdGuard Russian).

          Set this as the device's Remote auto-update URL:
          https://github.com/${{ github.repository }}/releases/download/blocklist/blocklist.bin"
          if gh release view blocklist >/dev/null 2>&1; then
            gh release edit blocklist --notes "$notes"
          else
            gh release create blocklist --title "Weekly blocklist" --notes "$notes" --latest=false
          fi
          gh release upload blocklist blocklist.bin --clobber
